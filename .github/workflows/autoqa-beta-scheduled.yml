name: AutoQA Beta Koyal

on:
  schedule:
    - cron: "10 19 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      flow:
        description: Flow(s) to run
        required: true
        default: both
        type: choice
        options:
          - both
          - script
          - audio

permissions:
  contents: read

concurrency:
  group: autoqa-beta-production
  cancel-in-progress: false

jobs:
  qa:
    name: Script and audio production validation
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    env:
      AUTOQA_URL: https://beta.koyal.ai
      AUTOQA_EMAIL: ${{ secrets.AUTOQA_EMAIL }}
      AUTOQA_PASSWORD: ${{ secrets.AUTOQA_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTOQA_STATE_KEY: ${{ secrets.AUTOQA_STATE_KEY }}
      LLM_PROVIDER: anthropic
      LLM_MODEL: claude-opus-4-8
      AUTOQA_EXHAUSTIVE: "true"
      AUTOQA_PRODUCTION_SUPERVISOR: "true"
      AUTOQA_SUPERVISOR_HUMAN_OVERRIDE_MS: "0"
      AUTOQA_PROMPT_TIMEOUT_MS: "60000"
      AUTOQA_PROCESSING_WAIT_MS: "1200000"
      AUTOQA_TERMINAL_WAIT_MS: "1200000"
      AGENT_BROWSER_HEADED: "true"
      AUTOQA_ALLOW_BROAD_RECYCLE_KILL: "true"
      # One initial attempt plus at most two clean retries. A retry is allowed
      # for an unrecovered browser-daemon wedge or when the completed AutoQA
      # summary has no more passes than failures.
      AUTOQA_HOSTED_ATTEMPTS: "3"
      AGENT_SHOW_CURSOR: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: autoqa/package-lock.json

      - name: Install dependencies
        working-directory: autoqa
        run: npm ci

      - name: Install native agent-browser and compatible browser
        run: |
          uname -m
          brew install agent-browser
          native_agent_browser="$(command -v agent-browser)"
          test -x "$native_agent_browser"
          "$native_agent_browser" install
          rm -f autoqa/node_modules/.bin/agent-browser
          ln -s "$native_agent_browser" autoqa/node_modules/.bin/agent-browser
          autoqa/node_modules/.bin/agent-browser --version

      - name: Validate required secrets
        run: |
          for name in AUTOQA_EMAIL AUTOQA_PASSWORD ANTHROPIC_API_KEY AUTOQA_STATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore encrypted learned state
        id: state-cache
        uses: actions/cache@v4
        with:
          path: autoqa/.scheduled-state/beta-koyal-state.tar.gz.enc
          key: autoqa-beta-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            autoqa-beta-state-${{ runner.os }}-

      - name: Decrypt learned state
        run: |
          cached="autoqa/.scheduled-state/beta-koyal-state.tar.gz.enc"
          seed="autoqa/state-seed/beta-koyal-state.tar.gz.enc"
          archive="$seed"
          if [[ -s "$cached" ]]; then
            archive="$cached"
            echo "Using the latest encrypted state cache."
          else
            echo "No cache exists yet; using the encrypted production seed."
          fi

          test -s "$archive"
          mkdir -p autoqa/.autoqa-state/beta.koyal.ai
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$archive" -pass env:AUTOQA_STATE_KEY \
            | tar -xz -C autoqa/.autoqa-state/beta.koyal.ai

          # Recipes were learned on a Mac. Make their fixture paths portable and
          # map ignored local audio fixtures to the equivalent tracked fixture.
          state="autoqa/.autoqa-state/beta.koyal.ai"
          perl -pi -e "s#/Users/apple/Desktop/happyflow#$GITHUB_WORKSPACE#g" \
            "$state/sitemap.json" "$state/recipes.json"
          perl -pi \
            -e "s#${GITHUB_WORKSPACE}/happyflow/test-audio-5sec.wav#${GITHUB_WORKSPACE}/happyflow/audio/assets/test-narration-short.wav#g;" \
            -e "s#${GITHUB_WORKSPACE}/happyflow/test-narration-short.wav#${GITHUB_WORKSPACE}/happyflow/audio/assets/test-narration-short.wav#g" \
            "$state/sitemap.json" "$state/recipes.json"

      - name: Run Script replay validation
        id: script
        if: ${{ github.event_name == 'schedule' || inputs.flow == 'both' || inputs.flow == 'script' }}
        continue-on-error: true
        working-directory: autoqa
        run: |
          set -u
          for attempt in $(seq 1 "$AUTOQA_HOSTED_ATTEMPTS"); do
            echo "[hosted] Script attempt $attempt/$AUTOQA_HOSTED_ATTEMPTS"
            python3 -c 'import subprocess; subprocess.run(["npx", "agent-browser", "--session", "autoqa-beta.koyal.ai", "close"], timeout=20)' || true
            sleep 2
            attempt_log="$RUNNER_TEMP/autoqa-script-attempt-$attempt.log"
            set +e
            (
              set -euo pipefail
              npx agent-browser --session autoqa-beta.koyal.ai --headed open about:blank
              npx agent-browser --session autoqa-beta.koyal.ai --headed set viewport 1440 1000
              npm run qa -- test \
                --url https://beta.koyal.ai \
                --flow manual-run-a-complete-new-script-to-final-v-51c33530 \
                --budget 800 --max-steps 40
            ) 2>&1 | tee "$attempt_log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            summary_line="$(grep -E '\[autoqa\] [0-9]+ PASS / [0-9]+ FAIL / [0-9]+ NEEDS REVIEW' "$attempt_log" | tail -n 1 || true)"
            pass_count=""
            fail_count=""
            if [[ "$summary_line" =~ \[autoqa\][[:space:]]+([0-9]+)[[:space:]]+PASS[[:space:]]+/[[:space:]]+([0-9]+)[[:space:]]+FAIL ]]; then
              pass_count="${BASH_REMATCH[1]}"
              fail_count="${BASH_REMATCH[2]}"
            fi

            if [[ "$attempt" -lt "$AUTOQA_HOSTED_ATTEMPTS" ]] && \
              grep -Eqi 'daemon recycle failed|still wedged|will keep failing until its daemon recovers|could not resolve a session-specific PID|aborted: agent-browser .*timed out|^.*Operation timed out\. The page may still be loading' "$attempt_log"; then
              echo "[hosted] Script attempt $attempt hit an unrecovered browser-daemon wedge; retrying with a clean native browser session"
              continue
            fi

            if [[ "$attempt" -lt "$AUTOQA_HOSTED_ATTEMPTS" ]] && \
              [[ -n "$pass_count" && -n "$fail_count" ]] && \
              (( pass_count <= fail_count )); then
              echo "[hosted] Script attempt $attempt ended with PASS=$pass_count and FAIL=$fail_count; PASS <= FAIL, retrying in exploratory recovery mode with a clean native browser session"
              continue
            fi

            echo "[hosted] Script attempt $attempt will not be retried (PASS=${pass_count:-unknown}, FAIL=${fail_count:-unknown}, status=$status)"
            exit "$status"
          done
          exit 1

      - name: Run Audio replay validation
        id: audio
        if: ${{ github.event_name == 'schedule' || inputs.flow == 'both' || inputs.flow == 'audio' }}
        continue-on-error: true
        working-directory: autoqa
        run: |
          set -u
          for attempt in $(seq 1 "$AUTOQA_HOSTED_ATTEMPTS"); do
            echo "[hosted] Audio attempt $attempt/$AUTOQA_HOSTED_ATTEMPTS"
            python3 -c 'import subprocess; subprocess.run(["npx", "agent-browser", "--session", "autoqa-beta.koyal.ai", "close"], timeout=20)' || true
            sleep 2
            attempt_log="$RUNNER_TEMP/autoqa-audio-attempt-$attempt.log"
            set +e
            (
              set -euo pipefail
              npx agent-browser --session autoqa-beta.koyal.ai --headed open about:blank
              npx agent-browser --session autoqa-beta.koyal.ai --headed set viewport 1440 1000
              npm run qa -- test \
                --url https://beta.koyal.ai \
                --flow manual-run-a-complete-new-audio-to-final-vi-d688b458 \
                --budget 800 --max-steps 40
            ) 2>&1 | tee "$attempt_log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            summary_line="$(grep -E '\[autoqa\] [0-9]+ PASS / [0-9]+ FAIL / [0-9]+ NEEDS REVIEW' "$attempt_log" | tail -n 1 || true)"
            pass_count=""
            fail_count=""
            if [[ "$summary_line" =~ \[autoqa\][[:space:]]+([0-9]+)[[:space:]]+PASS[[:space:]]+/[[:space:]]+([0-9]+)[[:space:]]+FAIL ]]; then
              pass_count="${BASH_REMATCH[1]}"
              fail_count="${BASH_REMATCH[2]}"
            fi

            if [[ "$attempt" -lt "$AUTOQA_HOSTED_ATTEMPTS" ]] && \
              grep -Eqi 'daemon recycle failed|still wedged|will keep failing until its daemon recovers|could not resolve a session-specific PID|aborted: agent-browser .*timed out|^.*Operation timed out\. The page may still be loading' "$attempt_log"; then
              echo "[hosted] Audio attempt $attempt hit an unrecovered browser-daemon wedge; retrying with a clean native browser session"
              continue
            fi

            if [[ "$attempt" -lt "$AUTOQA_HOSTED_ATTEMPTS" ]] && \
              [[ -n "$pass_count" && -n "$fail_count" ]] && \
              (( pass_count <= fail_count )); then
              echo "[hosted] Audio attempt $attempt ended with PASS=$pass_count and FAIL=$fail_count; PASS <= FAIL, retrying in exploratory recovery mode with a clean native browser session"
              continue
            fi

            echo "[hosted] Audio attempt $attempt will not be retried (PASS=${pass_count:-unknown}, FAIL=${fail_count:-unknown}, status=$status)"
            exit "$status"
          done
          exit 1

      - name: Encrypt updated learned state
        if: always()
        run: |
          state="autoqa/.autoqa-state/beta.koyal.ai"
          out="autoqa/.scheduled-state/beta-koyal-state.tar.gz.enc"
          mkdir -p "$(dirname "$out")"
          tar -cz -C "$state" \
            sitemap.json recipes.json statements.json allowlist.json \
            | openssl enc -aes-256-cbc -pbkdf2 -salt \
                -out "$out" -pass env:AUTOQA_STATE_KEY

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoqa-beta-${{ github.run_id }}
          path: autoqa/reports/beta.koyal.ai/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## AutoQA beta.koyal.ai"
            echo
            echo "| Flow | Outcome |"
            echo "|---|---|"
            echo "| Script | ${{ steps.script.outcome }} |"
            echo "| Audio | ${{ steps.audio.outcome }} |"
            echo
            echo "Detailed reports are attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure browser daemon and Chrome are closed
        if: always()
        working-directory: autoqa
        run: |
          python3 -c 'import subprocess; subprocess.run(["npx", "agent-browser", "--session", "autoqa-beta.koyal.ai", "close"], timeout=20)' || true

      - name: Set final workflow status
        if: always()
        run: |
          failed=0
          for outcome in "${{ steps.script.outcome }}" "${{ steps.audio.outcome }}"; do
            if [[ "$outcome" == "failure" || "$outcome" == "cancelled" ]]; then
              failed=1
            fi
          done
          exit "$failed"
